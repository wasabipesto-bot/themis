name: Astro CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  astro-check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [site, grouper]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json

      - name: Install dependencies
        working-directory: ./${{ matrix.project }}
        run: npm ci

      - name: Astro check
        working-directory: ./${{ matrix.project }}
        run: npx astro check
